apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emmonsha-ingress
  namespace: default
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "emmonsha.ru"
    secretName: wildcard-tls-certificate
  rules:
  - host: "emmonsha.ru"
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: session-service
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8087