apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-certificate
  namespace: default
spec:
  secretName: wildcard-tls-certificate
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: '*.emmonsha.ru'
  dnsNames:
  - '*.emmonsha.ru'
  - 'emmonsha.ru'