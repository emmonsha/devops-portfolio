apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-certificate
  namespace: default
spec:
  secretName: wildcard-tls-certificate
  issuerRef:
    name: local-ca-issuer
    kind: ClusterIssuer
  commonName: '*.emmonsha.ru'
  dnsNames:
  - '*.emmonsha.ru'
  - 'emmonsha.ru'
  duration: 2160h    # 90 дней
  renewBefore: 360h  # Обновлять за 15 дней до истечения