apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay с секретами и конфигурационными значениями
resources:
- ../../base
- configmap.yaml
- secrets.yaml
- postgresql-init-cm.yaml

patches:
# Изменяем типы сервисов на NodePort для внешнего доступа
- patch: |-
    - op: replace
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30081
  target:
    kind: Service
    name: session-service
- patch: |-
    - op: replace
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30087
  target:
    kind: Service
    name: gateway-service