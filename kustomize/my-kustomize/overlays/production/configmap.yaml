apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Database configuration - MULTI-DATABASE SETUP
  POSTGRES_HOST: "postgresql-service"
  POSTGRES_PORT: "5432"
  
  # Individual databases for each service
  POSTGRES_DB_BOOKING: "booking_db"
  POSTGRES_DB_HOTEL: "hotel_db"
  POSTGRES_DB_SESSION: "session_db" 
  POSTGRES_DB_PAYMENT: "payment_db"
  POSTGRES_DB_LOYALTY: "loyalty_db"
  POSTGRES_DB_REPORT: "report_db"
  
  # Default database (for backward compatibility)
  db.name: "booking_db"
  POSTGRES_DB: "booking_db"
  POSTGRES_USER: "CHANGE_ME"
  
  # RabbitMQ configuration
  RABBIT_MQ_HOST: "rabbitmq"
  RABBIT_MQ_PORT: "5672"
  RABBIT_MQ_USER: "guest"
  RABBIT_MQ_PASSWORD: "CHANGE_ME"
  RABBIT_MQ_QUEUE_NAME: "booking_queue"
  RABBIT_MQ_EXCHANGE: "booking_exchange"
  
  # Service-specific ports
  GATEWAY_SERVICE_PORT: "8087"
  SESSION_SERVICE_PORT: "8081"
  BOOKING_SERVICE_PORT: "8083"
  HOTEL_SERVICE_PORT: "8082"
  PAYMENT_SERVICE_PORT: "8084"
  LOYALTY_SERVICE_PORT: "8085"
  REPORT_SERVICE_PORT: "8086"
  
  # Service URLs
  SESSION_SERVICE_HOST: "session-service"
  HOTEL_SERVICE_HOST: "hotel-service"
  BOOKING_SERVICE_HOST: "booking-service"
  PAYMENT_SERVICE_HOST: "payment-service"
  LOYALTY_SERVICE_HOST: "loyalty-service"
  REPORT_SERVICE_HOST: "report-service"
  
  # UUIDs
  gateway-service.uuid: "b51ceda2-bfa5-11eb-8529-0242ac130003"
  booking-service.uuid: "911ccb4c-c055-11eb-8529-0242ac130003"
  
  # Server ports for each service
  server.port.booking: "8083"
  server.port.gateway: "8087"
  server.port.hotel: "8082"
  server.port.loyalty: "8085"
  server.port.payment: "8084"
  server.port.report: "8086"
  server.port.session: "8081"