apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emmonsha-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: "emmonsha.ru"
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: session-service
            port:
              number: 8081
      - path: /api/v1/gateway
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8087
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8087
  - host: "gateway.emmonsha.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8087
  - host: "session.emmonsha.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: session-service
            port:
              number: 8081