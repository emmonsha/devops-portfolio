apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session
  template:
    metadata:
      labels:
        app: session
    spec:
      containers:
      - name: session
        image: pavelignatiev/emmonsha_devops10_session-service:06.11.25
        ports:
        - containerPort: 8081  # server.port=8081
        env:
        # Database configuration - using the exact variable names from application.properties
        - name: SPRING_JPA_HIBERNATE_DIALECT
          value: "org.hibernate.dialect.PostgreSQL10Dialect"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "create"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-password
---
apiVersion: v1
kind: Service
metadata:
  name: session-service
spec:
  selector:
    app: session
  ports:
    - protocol: TCP
      port: 8081  # Port from application.properties
      targetPort: 8081
  type: LoadBalancer