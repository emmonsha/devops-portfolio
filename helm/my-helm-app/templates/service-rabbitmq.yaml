apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-helm-app.fullname" . }}-rabbitmq-service
  labels:
    {{- include "my-helm-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.rabbitmq.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.rabbitmq.service.port }}
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
    {{- if eq .Values.rabbitmq.service.type "NodePort" }}
    nodePort: {{ .Values.rabbitmq.service.nodePort }}
    {{- end }}
    protocol: TCP
  selector:
    {{- include "my-helm-app.selectorLabels" . | nindent 4 }}
    app: rabbitmq