apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-helm-app.fullname" . }}-rabbitmq
  labels:
    {{- include "my-helm-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.rabbitmq.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "my-helm-app.selectorLabels" . | nindent 6 }}
      app: rabbitmq
  template:
    metadata:
      labels:
        {{- include "my-helm-app.selectorLabels" . | nindent 8 }}
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: "{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
        imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "my-helm-app.fullname" . }}-rabbitmq-secret
              key: username
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "my-helm-app.fullname" . }}-rabbitmq-secret
              key: password
        resources:
          {{- toYaml .Values.rabbitmq.resources | nindent 10 }}