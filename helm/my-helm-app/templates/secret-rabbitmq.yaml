apiVersion: v1
kind: Secret
metadata:
  name: {{ include "my-helm-app.fullname" . }}-rabbitmq-secret
  labels:
    {{- include "my-helm-app.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.rabbitmq.username | default "CHANGE_ME" | b64enc | quote }}
  password: {{ .Values.rabbitmq.password | default "CHANGE_ME" | b64enc | quote }}