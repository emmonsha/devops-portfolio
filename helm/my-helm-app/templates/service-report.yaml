apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-helm-app.fullname" . }}-report-service
  labels:
    {{- include "my-helm-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.report.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.report.service.port }}
    targetPort: {{ .Values.report.service.port }}
    {{- if eq .Values.report.service.type "NodePort" }}
    nodePort: {{ .Values.report.service.nodePort }}
    {{- end }}
    protocol: TCP
  selector:
    {{- include "my-helm-app.selectorLabels" . | nindent 4 }}
    app: report