# --- PLAY 5: Установка GitLab Runner ---
- name: Install GitLab Runner
  hosts: k3s_master
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:

    # 1. Читаем токен прямо из /vagrant/.env на мастер-ноде
    - name: Read GITLAB_RUNNER_TOKEN from .env file
      shell: "grep '^GITLAB_RUNNER_TOKEN=' /vagrant/.env | cut -d '=' -f2- | tr -d '\\n\\r '"
      register: gitlab_token_raw
      changed_when: false

    - name: Store token as fact
      set_fact:
        gitlab_runner_registration_token: "{{ gitlab_token_raw.stdout }}"

    - name: Fail if token is empty
      fail:
        msg: "GITLAB_RUNNER_TOKEN не найден в /vagrant/.env — добавь строку GITLAB_RUNNER_TOKEN=<ваш-токен>"
      when: gitlab_runner_registration_token == ""

    # 2. Создание namespace
    - name: Create gitlab-runner namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: gitlab-runner
        state: present

    # 3. Создаём секрет для пайплайна из всего .env файла (DOCKER_USER, DOCKER_PASSWORD и др.)
    - name: Create gitlab-runner-env secret from .env file
      shell: |
        kubectl create secret generic gitlab-runner-env \
          --from-env-file=/vagrant/.env \
          --namespace=gitlab-runner \
          --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    # 4. Создание секрета с токеном регистрации для Helm chart
    - name: Create GitLab Runner registration secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: gitlab-runner-secret
            namespace: gitlab-runner
          type: Opaque
          stringData:
            runner-registration-token: "{{ gitlab_runner_registration_token }}"
            runner-token: ""

    # 5. Копирование RBAC манифеста на мастер-ноду
    - name: Copy rbac.yaml to master node
      copy:
        src: ./rbac.yaml
        dest: /tmp/gitlab-runner-rbac.yaml
        mode: '0644'

    # 6. Применение RBAC манифеста
    - name: Apply GitLab Runner RBAC
      kubernetes.core.k8s:
        state: present
        src: /tmp/gitlab-runner-rbac.yaml

    # 7. Копирование values файла на мастер-ноду
    - name: Copy values-runner-kaniko.yaml to master node
      copy:
        src: ./values-runner-kaniko.yaml
        dest: /tmp/values-runner-kaniko.yaml
        mode: '0644'

    # 8. Добавление Helm-репозитория GitLab
    - name: Add GitLab Helm repository
      kubernetes.core.helm_repository:
        name: gitlab
        repo_url: https://charts.gitlab.io

    # 9. Установка GitLab Runner через Helm с values для Kaniko
    - name: Install GitLab Runner via Helm
      kubernetes.core.helm:
        name: gitlab-runner
        chart_ref: gitlab/gitlab-runner
        release_namespace: gitlab-runner
        create_namespace: false
        update_repo_cache: true
        values_files:
          - /tmp/values-runner-kaniko.yaml