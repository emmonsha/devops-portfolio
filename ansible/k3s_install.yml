#export KUBECONFIG=./k3s_kubeconfig экспорт настроек кубера в хост
#применение ansible-playbook -i hosts.ini k3s_install.yml

#проверка Docker Registry:
# Проверь что pod запущен
# kubectl get pods -n registry
# Проверь сервис и nodePort
# kubectl get svc -n registry
# Проверь что registry доступен по порту
# curl http://192.168.56.11:31500/v2/_catalog
