---
# --- PLAY 0: Подготовка локального окружения (Ключи) ---
- name: Prepare Local Environment (Keys & Config)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: Create directory for Ansible keys
      file:
        path: "~/ansible_keys"
        state: directory
        mode: '0700'

    - name: Copy Server Key with correct permissions
      copy:
        src: ".vagrant/machines/server_node/virtualbox/private_key"
        dest: "~/ansible_keys/server.key"
        mode: '0600'

    - name: Copy Agent 1 Key with correct permissions
      copy:
        src: ".vagrant/machines/agent_node1/virtualbox/private_key"
        dest: "~/ansible_keys/agent1.key"
        mode: '0600'

    - name: Copy Agent 2 Key with correct permissions
      copy:
        src: ".vagrant/machines/agent_node2/virtualbox/private_key"
        dest: "~/ansible_keys/agent2.key"
        mode: '0600'

    - name: Copy Agent 3 Key with correct permissions
      copy:
        src: ".vagrant/machines/agent_node3/virtualbox/private_key"
        dest: "~/ansible_keys/agent3.key"
        mode: '0600'    

    - name: Copy Agent 4 Key with correct permissions
      copy:
        src: ".vagrant/machines/agent_node4/virtualbox/private_key"
        dest: "~/ansible_keys/agent4.key"
        mode: '0600'      


# --- PLAY 1: Установка Мастера ---
- name: Install K3s Master and Fetch Config
  hosts: k3s_master
  become: true
  tasks:
    - name: Install K3s Server
      shell: curl -sfL https://get.k3s.io | sh -s -
      environment:
        INSTALL_K3S_EXEC: >-
          server
          --node-ip={{ master_ip }}
          --advertise-address={{ master_ip }}
          --tls-san={{ master_ip }}
          --flannel-iface={{ k3s_iface }}
          --write-kubeconfig-mode 644
          --disable=traefik
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node-token to be generated
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read node-token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_base64

    - name: Store token as fact
      set_fact:
        k3s_token: "{{ node_token_base64['content'] | b64decode | trim }}"

    - name: Copy kubeconfig to local machine (Host)
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./k3s_kubeconfig
        flat: yes

    - name: Update kubeconfig server IP on local machine
      delegate_to: localhost
      become: false
      replace:
        path: ./k3s_kubeconfig
        regexp: '127\.0\.0\.1'
        replace: "{{ master_ip }}"

# --- PLAY 2: Установка Агентов ---
- name: Install K3s Agents
  hosts: k3s_agents
  become: true
  any_errors_fatal: true
  tasks:
    - name: Install K3s Agent
      shell: curl -sfL https://get.k3s.io | sh -s -
      environment:
        K3S_URL: "https://{{ master_ip }}:6443"
        K3S_TOKEN: "{{ hostvars['server_node']['k3s_token'] }}"
        INSTALL_K3S_EXEC: >-
          agent
          --node-ip={{ ansible_host }}
          --flannel-iface={{ k3s_iface }}
      args:
        creates: /usr/local/bin/k3s


# --- PLAY: Настройка локального registry для K3s ---
- name: Configure insecure registry on all nodes
  hosts: k3s_master:k3s_agents
  become: true
  tasks:
    - name: Ensure /etc/rancher/k3s directory exists
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Create registries.yaml
      copy:
        dest: /etc/rancher/k3s/registries.yaml
        content: |
          mirrors:
            "registry-docker-registry.registry.svc.cluster.local:5000":
              endpoint:
                - "http://{{ master_ip }}:31500"

    - name: Restart K3s server
      systemd:
        name: k3s
        state: restarted
      when: inventory_hostname in groups['k3s_master']

    - name: Restart K3s agent
      systemd:
        name: k3s-agent
        state: restarted
      when: inventory_hostname in groups['k3s_agents']

# --- PLAY 4: Установка Аддонов (Ingress, Helm, Monitoring)  ---
- name: Configure Cluster Addons
  hosts: k3s_master
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    # 1. Установка Helm
    - name: Install Helm if not present
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Install helm-diff plugin
      kubernetes.core.helm_plugin:
        plugin_path: https://github.com/databus23/helm-diff
        state: present    

    # 2. Установка Nginx Ingress Controller
    - name: Add Ingress Nginx repo
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    - name: Install Nginx Ingress Controller with fixed NodePorts
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        update_repo_cache: true
        values:
          controller:
            service:
              type: NodePort
              nodePorts:
                http: 32665
                https: 32098


    # 3. Настройка репозиториев Helm
    - name: Add Jetstack Helm repository
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io

