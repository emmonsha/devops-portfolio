build:summary:
  stage: build
  image: alpine:latest
  needs:
    - job: build:gateway
      optional: true
    - job: build:session
      optional: true
    - job: build:booking
      optional: true
    - job: build:hotel
      optional: true
    - job: build:loyalty
      optional: true
    - job: build:payment
      optional: true
    - job: build:report
      optional: true
  script:
    - echo "Build complete for ${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature_.*/'
      when: always
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    - when: never
  allow_failure: true