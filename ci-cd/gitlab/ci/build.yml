# =============================================================================
# BUILD.YML - Build Stage (Kaniko)
# =============================================================================

.build-service:
  stage: build
  needs:
    - job: prepare:load-variables
      artifacts: true
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "Creating Docker config for ${DOCKER_USERNAME}"
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "https://index.docker.io/v1/": {
            "auth": "$(printf '%s:%s' "${DOCKER_USERNAME}" "${DOCKER_PASSWORD}" | base64 | tr -d '\n')"
          }
        }
      }
      EOF
    - echo "Building ${SERVICE_NAME}"
    - echo "Pushing to ${DOCKER_REPOSITORY}/${SERVICE_NAME}"
    - cd ${SERVICES_DIR}/${SERVICE_NAME}
    - test -f Dockerfile || exit 1
    - | 
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/${SERVICES_DIR}/${SERVICE_NAME}" \
        --dockerfile "${CI_PROJECT_DIR}/${SERVICES_DIR}/${SERVICE_NAME}/Dockerfile" \
        --destination "${DOCKER_REPOSITORY}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        --destination "${DOCKER_REPOSITORY}/${SERVICE_NAME}:latest"\
        --compressed-caching=false \
        ${KANIKO_ARGS}
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature_.*/'
      when: always
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - src/services/${SERVICE_NAME}/**/*
        - src/helm/**/*
      when: always
    - when: never

build:gateway:
  extends: .build-service
  variables:
    SERVICE_NAME: gateway-service
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature_.*/'
      changes:
        - src/services/gateway-service/**/*
      when: always
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - src/services/gateway-service/**/*
      when: always
    - when: never

